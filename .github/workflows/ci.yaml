name: "CI"

on:
  push:
    paths:
      - ".github/**/*"
      - "*.ts"
      - "**/*.ts"
      - "deno.json"
      - "deno.lock"
      - "mise.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # denoはmise.tomlのものを使う。betterleaksはpre-commit専用なので入れない
      - uses: jdx/mise-action@v5
        with:
          install_args: "deno"
      - run: deno run verify
