name: "Release"
on: workflow_dispatch
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g pnpm@12.21.0
      # conventionalcommits v10はrelease notesが空になるバグがあるため9.3.1に固定
      # https://github.com/semantic-release/release-notes-generator/issues/992
      - run: |
          pnpm dlx \
             --package semantic-release@25.0.9 \
             --package conventional-changelog-conventionalcommits@9.3.1 \
             --package @semantic-release/git@11.0.1 \
             --package @sebbo2002/semantic-release-jsr@4.0.3 \
              semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
